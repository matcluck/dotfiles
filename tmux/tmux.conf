# ─── Behaviour ────────────────────────────────────────────────────────────────

# Enable mouse mode by default (scrolling, pane resizing, selection).
set -g mouse on

# Bigger scrollback – default 2000 is too small for long agent runs.
set -g history-limit 100000

# Windows/panes start at 1 and renumber when one is closed (no gaps).
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Let Claude Code/Codex hooks own the window name.
# tmux-sensible (loaded later via tpm) and shell prompt OSC escapes can both
# re-enable rename, so re-enforce per-window via hooks below.
setw -g automatic-rename off
setw -g allow-rename off
set-hook -g after-new-window  'setw automatic-rename off; setw allow-rename off'
set-hook -g after-split-window 'setw automatic-rename off; setw allow-rename off'

# Bell monitoring – flag windows when an agent rings the bell, and surface
# bells from inactive windows in the status line.
setw -g monitor-bell on
set -g visual-bell off
set -g bell-action other

# Clipboard – drag-to-select-and-copy, double-click word select.
# OSC 52 makes copy work over SSH (alacritty supports it natively).
set -g set-clipboard on
set -as terminal-features ',alacritty*:clipboard'
if-shell '[ -n "$WAYLAND_DISPLAY" ]' \
  'set -g @copy_cmd "wl-copy"' \
  'set -g @copy_cmd "xclip -selection clipboard -in"'
bind -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"
bind -n DoubleClick1Pane \
  select-pane \; copy-mode -M \; send-keys -X select-word \; \
  send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"

# Reload binding.
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# Click the chicken pill only to cycle through sessions. The pill is wrapped
# in `#[range=user|chicken]` in status-left so MouseDown1Status fires with
# mouse_status_range == "chicken" only when the pill itself is clicked.
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},chicken}' 'switch-client -n' 'select-window -t='

# ─── Plugins (tpm) ────────────────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# ─── Catppuccin theme ─────────────────────────────────────────────────────────

set -g @catppuccin_flavor 'mocha'
# 'rounded' uses Nerd Font powerline glyphs – setup.sh installs Hack Nerd Font.
set -g @catppuccin_window_status_style 'rounded'
# Cap long agent-managed names so they do not dominate the status bar.
set -g @catppuccin_window_default_text ' #{?#{!=:#{=30:window_name},#{window_name}},#{=29:window_name}…,#{window_name}}'
set -g @catppuccin_window_current_text ' #{?#{!=:#{=30:window_name},#{window_name}},#{=29:window_name}…,#{window_name}}'
set -g @catppuccin_session_icon '🐔️ '
# Warm the session badge up so the chicken does not sit on neon green.
set -g @catppuccin_session_color '#{?client_prefix,#{E:@thm_red},#{E:@thm_peach}}'
set -g @catppuccin_status_session_icon_bg '#{?client_prefix,#{E:@thm_red},#{E:@thm_peach}}'

# ─── Status bar layout ────────────────────────────────────────────────────────
# Helper script lives next to this file in the dotfiles repo and is copied
# to ~/.config/tmux/status-helper.sh by setup.sh.

set -g status-position bottom
set -g status-interval 5
set -g status-left-length 120
set -g status-right-length 200

# Left: session + env badge (red=prod, green=dev, yellow=other) + waiting count.
set -g status-left "#[range=user|chicken]#{E:@catppuccin_status_session}#[fg=#181825,reverse]#[default]#[norange]#[fg=#(~/.config/tmux/status-helper.sh env-hex),bold]#(~/.config/tmux/status-helper.sh env)#[fg=#f9e2af,bold]#(~/.config/tmux/status-helper.sh waiting #S) "

# Right: git branch · wg · clock.
set -g status-right ''
set -ag status-right '#[fg=#cba6f7] #(~/.config/tmux/status-helper.sh git "#{pane_current_path}")  '
set -ag status-right '#[fg=#89dceb]#(~/.config/tmux/status-helper.sh wg)  '
set -ag status-right '#[fg=#cdd6f4]%H:%M '

# tpm bootstrap – must run before the window-status-format override below.
run '~/.tmux/plugins/tpm/tpm'

# tmux-sensible sets aggressive-resize on, which causes status bar to render at
# two positions when Termius (xterm-256color) negotiates terminal size on attach.
# Also re-enable alternate screen for xterm so old status bar positions are
# properly erased on resize (tmux-sensible disables this via xterm* glob).
setw -g aggressive-resize off
set -ag terminal-overrides ',xterm*:smcup=\E[?1049h:rmcup=\E[?1049l'
set-hook -g client-attached 'refresh-client'

# Catppuccin can fall back to #T (pane title), which Codex updates while it
# runs. Override after tpm so active and inactive tabs both render the stable
# tmux window name, only changing color when selected.
set -g window-status-format "#[fg=#11111b,bg=#{@thm_overlay_2}]#[fg=#181825,reverse]#[none]#I #[fg=#cdd6f4,bg=#{@thm_surface_0}] #{?#{!=:#{=30:window_name},#{window_name}},#{=29:window_name}…,#{window_name}}#[fg=#181825,reverse]#[default]"
set -g window-status-current-format "#[fg=#11111b,bg=#{@thm_mauve}]#[fg=#181825,reverse]#[none]#I #[fg=#cdd6f4,bg=#{@thm_surface_1}] #{?#{!=:#{=30:window_name},#{window_name}},#{=29:window_name}…,#{window_name}}#[fg=#181825,reverse]#[none]"

# Local overrides – sourced if present. Drop site/host/personal config in
# ~/.config/tmux/local.conf; this file stays out of the public dotfiles repo.
if-shell '[ -f ~/.config/tmux/local.conf ]' 'source-file -q ~/.config/tmux/local.conf'
